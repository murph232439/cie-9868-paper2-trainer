<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>9868 Paper 2 写作训练站</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="brand" type="button" data-route="#/home" aria-label="回到首页">
        <span class="brand-mark">9868</span>
        <span>
          <strong>Paper 2 写作训练站</strong>
          <small>审题 · 破题 · 结构 · 语言</small>
        </span>
      </button>

      <div class="stats" id="topStats"></div>

      <nav class="top-actions" aria-label="全局导航">
        <button class="icon-button" type="button" data-route="#/language" title="语言升级库">
          <i data-lucide="sparkles"></i>
          <span>语言库</span>
        </button>
        <button class="icon-button" type="button" data-route="#/progress" title="我的进度">
          <i data-lucide="chart-no-axes-column-increasing"></i>
          <span>进度</span>
        </button>
        <button class="icon-button" type="button" id="projectionToggle" title="课堂投屏模式">
          <i data-lucide="presentation"></i>
          <span>投屏</span>
        </button>
      </nav>
    </header>

    <main id="app" class="app-shell"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script type="module" src="./app.js?v=18"></script>
  </body>
</html>
